name: build
on:
  push:
  workflow_dispatch:

jobs:
  client-mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: balance-nametag-client-mod
          path: client-mod/build/libs/balance-nametag-*.jar

  server-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: balance-nametag-server-plugin
          path: server-plugin/build/libs/*.jar
